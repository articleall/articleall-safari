<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Articleall settings</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="panel">
      <header><div class="brand-mark" aria-hidden="true">A</div><div><h1>Articleall</h1><p id="subtitle">Settings</p></div></header>
      <section class="setting"><div><strong id="global-label">Auto-redirect</strong><span id="global-status" role="status"></span></div><label class="switch"><input id="enabled" type="checkbox"><span class="slider" aria-hidden="true"></span></label></section>
      <h2 id="sites-heading">Supported sites</h2>
      <div id="sites"></div>
      <p id="error" class="error" role="alert" hidden></p>
      <a id="back" href="#">Back to Articleall</a>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
