name: Articleall
options:
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Articleall:
    type: application
    platform: macOS
    sources:
      - path: Articleall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.articleall
        INFOPLIST_FILE: Articleall/Info.plist
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: Articleall Extension
        embed: true
  Articleall Extension:
    type: app-extension
    platform: macOS
    sources:
      - path: Articleall Extension
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.articleall.extension
        INFOPLIST_FILE: Articleall Extension/Info.plist
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
